<!DOCTYPE html>
<html>
<head>
    <title>Puzzles Games</title>
    <link rel="icon" href="/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <button type="button" class="home-button" onclick="window.location.href='/'" aria-label="Home">🏠︎</button>

    </button>
    
    <div class="top-bar">


        <button type="button" class="category-button allgames-button" onclick="window.location.href='/allgames/'">ALL GAMES</button>

        <p>|</p>

        <button type="button" class="category-button action-button" onclick="window.location.href='/action/'">ACTION</button>

        <p>|</p>

        <button type="button" class="category-button idle-button" onclick="window.location.href='/idle/'">IDLE</button>
        <p>|</p>

        <button type="button" class="category-button puzzles-button" onclick="window.location.href='/puzzles/'">PUZZLES</button>


    </div>


    <h1>PUZZLE GAMES</h1>
    <input type="text" class="main-search" placeholder="🔍 Search games..." aria-label="Search games">

     <div class="game-holder">

    <button type="button" class="image-button" onclick="window.location.href='/puzzles/games/tomb-of-the-dash/'" aria-label="Play Game Name">
    <img src="/thumbnails\tombofthedash.jpg" alt="Tomb of the Dash">
    </button>

    <button type="button" class="image-button" onclick="window.location.href='/puzzles/games/master-chess/'" aria-label="Play Game Name">
    <img src="/thumbnails/Master Chess Multiplayer-512x340.jpg" alt="Master Chess">
    </button>

    <button type="button" class="image-button" onclick="window.location.href='/puzzles/games/2048-legend/'" aria-label="Play Game Name">
    <img src="/thumbnails/2048 Legend-512x384.jpg" alt="2048 Legend">
    </button>

    <button type="button" class="image-button" onclick="window.location.href='/puzzles/games/2048-legend/'" aria-label="Play Game Name">
    <img src="/thumbnails/Master Checkers-512x340.jpg" alt="Master Checkers">
    </button>


    </div>
  

    <div id="stars"></div>
    

    <script src="/script.js"></script>
</body>
</html>
